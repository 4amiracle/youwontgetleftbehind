---
layout: default
---
<section class="page-hero">
  <div class="wrap{% if page.photo %} page-hero-split{% endif %}">
    <div>
      <p class="mono-label">{{ page.eyebrow }}</p>
      <h1 class="h1">{{ page.heading | default: page.title }}</h1>
      {% if page.lede %}<p class="lede lede-lg">{{ page.lede }}</p>{% endif %}
      {% if page.lede_close %}<p class="lede-close">{{ page.lede_close }}</p>{% endif %}
    </div>
    {% if page.photo %}{% include portrait.html %}{% endif %}
  </div>
</section>
{{ content }}
